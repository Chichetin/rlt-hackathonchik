# CI (#285, D-105): the same checks as `make check` and `make e2e`, in a clean environment.
# Organizers' data is not needed: pytest skips tests without data, e2e runs on fixtures
# (tests/fixtures, src/ui/playwright.config.ts). check-pg (#291) runs pytest against a live Postgres + pgvector.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # deploy.yml (#312) checks the very sha it ships

permissions:
  contents: read

# A PR keeps only its latest run. Anything else is grouped by sha: every commit of main gets its own run, and a
# run called from deploy.yml (github.workflow is the caller's name there) never waits on the push run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  FORCE_COLOR: "1"

jobs:
  check:
    name: check (make check)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ui/package-lock.json
      - name: Install dependencies
        run: |
          uv sync --frozen --extra pg
          cd src/ui && npm ci --no-fund --no-audit
      # The target itself, not a copy of its list: a check added to `make check` lands here too.
      # -k: run every prerequisite and show all failures, not only the first.
      - run: make -k check

  check-pg:
    name: check-pg (pytest on Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16 # as docker-compose.yml (D-054)
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app # secret-scan: allow — throwaway service container of the job
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U app" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app # secret-scan: allow
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false # the same key is saved by the check job
      - run: uv sync --frozen --extra pg
      # src/db/load.py does `INSTALL postgres` in DuckDB: the extension comes from extensions.duckdb.org once per lockfile.
      - name: Cache DuckDB extensions
        uses: actions/cache@v6
        with:
          path: ~/.duckdb/extensions
          key: duckdb-ext-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      # The whole suite: a new Postgres test needs no change here.
      - name: pytest with TEST_DATABASE_URL
        run: uv run --frozen pytest -rs | tee pytest.log
        shell: bash -o pipefail {0}
        env:
          PY_COLORS: "0" # plain text in pytest.log: the next step greps it
      - name: No test skipped for a missing database
        run: |
          if grep -E 'SKIPPED.*TEST_DATABASE_URL' pytest.log; then
            echo "::error::Postgres tests were skipped although TEST_DATABASE_URL is set"
            exit 1
          fi

  e2e:
    name: e2e (make e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false # the same key is saved by the check job
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ui/package-lock.json
      - name: Install dependencies
        run: |
          uv sync --frozen --extra pg
          cd src/ui && npm ci --no-fund --no-audit
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/ui/package-lock.json') }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: src/ui
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: src/ui
        run: npx playwright install-deps chromium
      - run: make e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: src/ui/test-results/
          retention-days: 7
          if-no-files-found: ignore
