# Что реально работает из схемы масштабирования (раздел 11 workflow): API, воркер обогащения
# через очередь (таблица задач в Postgres), БД. Без Redis/Celery/Kubernetes.
# Kickoff (D-017 г): compose не на критическом пути демо (D-007); поднимается в T-13 для слайда масштабирования.
services:
  db:
    image: pgvector/pgvector:pg16   # Postgres 16 + pgvector (D-023): данные лотов и векторный поиск
    ports: ["127.0.0.1:${PG_PORT:-5432}:5432"]   # загрузчик parquet → Postgres запускается с хоста (make db-load)
    shm_size: 2gb   # параллельная сборка HNSW держит maintenance_work_mem в /dev/shm (по умолчанию 64M — падает)
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app   # secret-scan: allow — локальная БД демо, наружу не открыта
      POSTGRES_DB: app
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      retries: 20
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: [{path: .env, required: false}]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app   # secret-scan: allow
      SOURCE_CACHE: /app/cache/sources.sqlite
      HF_HUB_OFFLINE: "1"   # модель запроса pg_hybrid — только из кеша хоста (make models), без сети на площадке
    volumes: ["./cache:/app/cache", "./data:/app/data:ro", "./indexes:/app/indexes:ro",
              "${HOME}/.cache/huggingface:/root/.cache/huggingface:ro"]
    depends_on: {db: {condition: service_healthy}}
  worker:
    build: .
    command: ["python", "-m", "src.worker.worker"]
    env_file: [{path: .env, required: false}]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app   # secret-scan: allow
      SOURCE_CACHE: /app/cache/sources.sqlite
    volumes: ["./cache:/app/cache", "./data:/app/data:ro"]
    depends_on: {db: {condition: service_healthy}}
volumes:
  dbdata:
