# Что реально работает из схемы масштабирования (раздел 11 workflow): API, воркер обогащения
# через очередь (таблица задач в Postgres), БД. Без Redis/Celery/Kubernetes.
# [ОБНОВИТЬ 01.10] нужен ли compose вообще — решает kickoff (research/DECISIONS.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app   # secret-scan: allow — локальная БД демо, наружу не открыта
      POSTGRES_DB: app
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      retries: 20
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: [{path: .env, required: false}]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app   # secret-scan: allow
      SOURCE_CACHE: /app/cache/sources.sqlite
    volumes: ["./cache:/app/cache", "./data:/app/data:ro", "./indexes:/app/indexes:ro"]
    depends_on: {db: {condition: service_healthy}}
  worker:
    build: .
    command: ["python", "-m", "src.worker.worker"]
    env_file: [{path: .env, required: false}]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app   # secret-scan: allow
      SOURCE_CACHE: /app/cache/sources.sqlite
    volumes: ["./cache:/app/cache", "./data:/app/data:ro"]
    depends_on: {db: {condition: service_healthy}}
volumes:
  dbdata:
