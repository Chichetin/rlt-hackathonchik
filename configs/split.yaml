# Разбиение по времени (research/EVAL.md, раздел 7 workflow). Признаки — только из данных до
# cutoff; dev — запросы из [cutoff, holdout_from); holdout — с holdout_from, запечатан
# (читает только `make eval-final`).
# Даты — по профилю (research/PROBLEM.md, `uv run python -m src.ingest.profile`): данные 2024-01-08…2025-12-31;
# dev 2025-07…09 — 51 600 лотов с участниками, holdout 2025-10…12 — 88 853. Поле даты — Извещения.publish_date.
cutoff: "2025-07-01"
holdout_from: "2025-10-01"
# `make eval-final` оценивает детерминированную выборку holdout (#145, docs/REVIEW.md): весь holdout —
# 88 848 кейсов по 0.25–0.30 с → 6–7.5 ч одним запуском, не помещается в окно до code freeze. 3 000 кейсов —
# ≈ 15–25 мин, 95% CI recall@10 ≈ ±0.016. Выборка задана здесь до запуска (входит в sha256 конфигурации):
# n кейсов с наименьшим sha256(holdout_seed:query_id). null — весь holdout.
holdout_sample: 3000
holdout_seed: 20261002
cases:
  # собирает `uv run python -m src.eval.build_cases` (T-07, #14); счётчики — eval/cases/build_stats.json
  dev: eval/cases/dev.jsonl                         # стратифицированная подвыборка dev, в git (D-032)
  dev_full: data/processed/eval/dev_full.jsonl      # все кейсы dev, вне git
  real: eval/cases/real.jsonl                       # 5–10 реальных кейсов dev для демо и разбора
  holdout: data/processed/eval/holdout.jsonl        # вне git; читает только eval-final
