# dev 2025-07…09 — 51 600 лотов с участниками, holdout 2025-10…12 — 88 853. Поле даты — Извещения.publish_date.
cutoff: "2025-07-01"
holdout_from: "2025-10-01"
cases:
  dev: eval/cases/dev.jsonl                         # собирает T-07 (docs/plans/2026-10-01-plan.md)
  holdout: data/processed/eval/holdout.jsonl        # вне git; собирает DATA, читает только eval-final
