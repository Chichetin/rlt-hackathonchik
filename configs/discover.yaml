# Релевантность новых поставщиков (блок «Новые», #77, src/match/new_fit.py, research/METHODOLOGY.md
# «Релевантность новых поставщиков»). configs/search.yaml не трогаем: его веса — блок истории.
new_fit:
  # off    — product_fit_new не считается;
  # shadow — считается и пишется в Discovery.fit_new и лог, выдача и балл НЕ меняются (по умолчанию);
  # on     — product_fit блока «Новые» = product_fit_new. Только для эксперимента: включение по
  #          умолчанию — изменение методологии скоринга, подтверждение человека №3.
  # Переопределение без правки файла: DISCOVERY_NEW_FIT=off|shadow|on.
  mode: shadow
  # Доли из предложения #77: 0.3 ОКВЭД + 0.4 текст + 0.3 LLM. Без LLM (этот инкремент) доля LLM
  # делится пропорционально: 3/7 и 4/7; в объяснении — «LLM-проверка не выполнялась».
  weights: {okved: 0.3, text: 0.4, llm: 0.3}
  # Сигнал 8: глубже класса ОКВЭД строки (5+ цифр) сверяется с полным ОКПД2 запроса.
  # agree — цифры совпали, class — ОКВЭД строки только класса (не говорит ни за, ни против),
  # differs — ОКВЭД строки уходит в другую подгруппу класса. Оптовые коды 46.* не сравниваются.
  depth: {agree: 1.0, class: 0.85, differs: 0.6}
  # Сигнал 6: совпавшие основы слов запроса (5 букв) с названием и наименованием основного ОКВЭД.
  # Вклад слова: в названии 1.0, только в ОКВЭД 0.5; слово из профиля ОКПД2 (а не из запроса) — x0.5.
  # text_match = min(1, сумма / text_saturation).
  text_saturation: 2.0
  name_hit: 1.0
  okved_hit: 0.5
  profile_hit: 0.5
  # Сигнал 8: профиль полного ОКПД2 запроса — частые слова наименований позиций с этим кодом в ТРУ
  # (данные организаторов, до as_of). Код укорачивается до подгруппы / группы / подкласса, пока
  # позиций меньше profile_min_positions; до класса не укорачивается.
  profile_terms: 8
  profile_min_positions: 20
  profile_min_share: 0.05
  profile_max_names: 2000
  # Сигнал 7: множитель (1 - minus_penalty), если в названии или ОКВЭД строки есть минус-слово класса
  # и этого слова нет в запросе. Ручная таблица на демо-категории; ключ — класс ОКПД2 запроса или
  # префикс основного ОКВЭД строки. Основы слов — нижний регистр, совпадение с началом слова
  # («шин» ловит «шины», но не «машины»).
  minus_penalty: 0.5
  minus_words:
    "22.19": [шланг, рукав, шин, ремн, уплотн, коврик, перчат]
    "32.99": [кукл, игрушк, свеч, сувенир, щетк, зонт]
    "71.12": [застройщ, девелоп]
    "85.42": [водител, автошкол]
  # Слова, которые не отличают товар: служебные слова закупки (из запроса) и общие слова
  # наименований ОКВЭД и названий (не считаются совпадением).
  query_stopwords: [постав, нужд, году, годы, выпол, работ, оказа, услуг, закуп, товар, обесп,
                    требо, соотв, санкт, петер, спб, гбу, гбоу, гбуз, гбдоу, учреж, государ,
                    бюдже, контр, проче, прочи, штука, набор, издел, предн, для, или, тип, адрес,
                    район, испол]
  text_stopwords: [общес, огран, ответ, акцио, публи, непуб, закры, откры, произ, прочи, проче,
                   торго, оптов, деяте, издел, други, групп, включ, услуг, работ, предос, компа,
                   фирма, предп, научн, центр, облас, сфере]
