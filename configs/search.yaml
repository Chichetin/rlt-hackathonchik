# Конфигурация поиска, которую оценивает `make eval` и замораживает `make eval-final`.
# Любая правка = новая конфигурация (новый sha256). Источник: разделы 5 и 7 workflow.
retriever: bm25          # T-02: stub → bm25 (v1, D-029) → bm25+okpd2 → hybrid_rrf (только через эксперимент)
tokenizer: prefix5       # prefix5 | snowball | pymorphy (#116); переопределение — переменная BM25_TOKENIZER
# Исправление раскладки и опечаток в запросе (#282, src/match/speller.py, D-109): словарь — словоформы позиций
# индекса. Замер S-282 (research/EXPERIMENTS.md, с ранжировщиком D-103): чистые dev 2000 — метрики те же; запрос
# в латинской раскладке recall@10 0.164 → 0.470. «Искать как введено» — filters.spell = "off".
spell: true
k: 20
# Веса H-15f (#22, #174, подтверждение человека №3 01.10; research/DECISIONS.md D-077), нормированные к 1:
# 0.8 / 0.2 / 0.05 из configs/experiments.yaml, делённые на 1.05 — порядок как у H-15f с точностью до
# округления балла до 4 знаков, максимум балла 1.0.
# Было (D-004, v1): 0.35 / 0.2 / 0.2 / 0.1 / 0.1 / 0.05. Изменение состава компонент или формулы — подтверждение
# человека №3 (CLAUDE.md): это слайд.
# #576 (решение человека 02.10, подтверждение №3): балл почти целиком был «Соответствием товару», у лучшего
# кандидата оно всегда 1.0, остальные критерии в карточке — нули. Было 0.762 / 0.19 / 0.0 / 0.048 / 0.0 / 0.0.
# Порядок с заказчиком задаёт ранжировщик (его признаки прежние) — меняются балл и порядок свободного текста.
# #585 (решение человека 02.10, подтверждение №3): в балл входят ещё два критерия — «Надёжность» по истории
# (reliability.mode: on) и «Цена» — НМЦК закупки против медианы НМЦК лотов поставщика (options.price: scale).
# Без НМЦК вес цены делится между остальными пропорционально. Было (#576) 0.5 / 0.25 / 0 / 0.15 / 0.1 / 0.
weights:
  product_fit: 0.4
  experience: 0.2
  reliability: 0.15
  activity: 0.1
  geography: 0.07         # ИП без КПП — по региону ИНН (signals.inn_region), иначе H-15f: штраф ИП
  price: 0.08
# Опции скоринга H-15f (src/match/search.py OPTIONS): product_fit = 0.8 · BM25 + 0.2 · глубина ОКПД2;
# experience — лоты и победы среди лотов с похожими позициями, а не во всей группе ОКПД2; равные баллы — по BM25.
options:
  fit_bm25_share: 0.8
  # #576: половина текстовой части — совпадение слов запроса с наименованием лучшей позиции кандидата
  # (0.7 · доля слов запроса в наименовании + 0.3 · доля слов наименования из запроса): максимум не у всех
  name_share: 0.5
  # #576: опыт насыщается не раньше самого опытного кандидата запроса — в ходовой категории не у всех 1.0
  exp_scale: pool
  price: scale            # #585: «Цена» — масштаб закупки против типичного лота поставщика
  experience_by: similar
  tie_break: bm25
# Путь без ML (#511, D-179; подтверждение человека №3 — M1hairu 02.10): запрос без заказчика, порядок которого задаёт
# формула v2 без ранжировщика (правило #490 или `ranker: null`), — опции поверх `options:` только для него. Ранжировщик
# читает компоненты как признаки и обучен на `options:`: запросы с заказчиком и порядок LightGBM не меняются.
# Насыщение опыта 100 лотов / 50 побед (как H-196-sat100): dev 2 000 «только предмет» к v2 — winner@10 +0.010
# [+0.002, +0.018], MRR +0.021 [+0.014, +0.028], recall@10 +0.008 [+0.001, +0.016] (eval/results/F-511-sat100.json).
# #612 (поручение человека 02.10 «лучшие по замерам», подтверждение №3): порядок пути без заказчика — по весам до #576
# (H-15f 0.762 / 0.19 / 0.048 над значениями, которые читает ранжировщик) + sat100, как F-511-sat100; балл и карточка —
# веса выше (D-198). Свободный текст dev 2 000: D-198 winner@10 0.446 (D198-free.json) → см. строку D-… (#612).
no_customer_options:
  sat_lots: 100
  sat_wins: 50
  order_weights: {product_fit: 0.762, experience: 0.19, activity: 0.048}
# Сигналы экспериментов (#22, src/match/signals.py): доля в [0, 1], по умолчанию 0 = v1 без изменений.
# incumbent — участие в лотах того же заказчика до as_of, подмешивается в experience.
signals:
  incumbent: 0.0
  # inn_region (H-15c) — регион ИП без КПП / с КПП 000000000 по первым двум цифрам ИНН, доля geography.
  inn_region: 1.0         # #576: география входит в балл — ИП без КПП не штрафуется
# Обученный ранжировщик (#198, подтверждение человека №3 02.10; research/DECISIONS.md D-103): порядок задаёт
# LightGBM LambdaMART поверх кандидатов и компонент v2 (их значения — входы модели); балл — ровно формула выше
# (сумма критериев карточки), порядок — модель, «Выше следующего» — почему выше соседа (D-156, #278).
# dev recall@10 0.491 → 0.572 (eval/results/R-198-gbm.json). Нет файла модели или
# lightgbm — порядок v2 с заметкой. Выключить: `ranker: null` (запись v2 в configs/experiments.yaml).
# D-171 (#486): R-long — та же LightGBM, обучена на 4 квартальных окнах [2024-07-01, 2025-07-01) (признаки каждого
# окна строго до его начала); dev 2 000 и свежие 2 000 — значимо выше R-198-gbm. Прежняя модель — R-198-gbm.txt.
# customer_only (#490, D-172): запрос без ИНН заказчика — порядок v2: модель обучена только на запросах с заказчиком;
# на свободном тексте без него R-198 хуже v2: dev 2 000, `--free-text`, winner@10 0.425 → 0.467
# (eval/results/G-490-free-off.json → G-490-free.json); R-long: 0.413 → 0.467, Δ +0.055 [+0.037, +0.071]
# (G-490L-free-off.json → G-490L-free.json, research/EXPERIMENTS.md, строка G-490).
ranker: {kind: lgbm, model: models/ranker/R-long-gbm.txt, customer_only: true}
# Профили весов по типу закупки (#104, src/match/profiles.py): тип — по классу ОКПД2 запроса (явного или
# предсказанного): товар — 01–32, 35; работы/услуги — 33, 36–99; смешанный или неизвестный — веса выше.
# Значения — правки поверх weights, например {goods: {geography: 0.048}}. Пусто = один набор weights для всех;
# включение по умолчанию — подтверждение человека №3.
weights_by_type: {}
# Надёжность поставщика (#72, src/match/reliability.py, research/METHODOLOGY.md «reliability»):
# off — как v1 (D-029, «нет данных»); shadow — считается только у показанных top-k и показывается в карточке
# с весом 0, балл и порядок не меняются; on — входит в балл с весом weights.reliability (при ранжировщике порядок
# задаёт модель). Включение (on) — изменение методологии: только с подтверждением человека №3, до него — только
# в конфигурации эксперимента (D-157).
reliability:
  mode: on                # #585: в балле с весом weights.reliability
