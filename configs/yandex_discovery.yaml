# Discovery через Yandex Search API по тонким группам ОКПД2 (#194; метрика тонких групп — #122).
# Запросы — «шаблон × товар» на группу; товары взяты из частых product_name группы в лотах ЭМ до cutoff
# (data/processed/items.parquet), формулировки короткие, как их набрал бы человек.
# Лимит API — 2500 запросов на весь хакатон (YANDEX_SEARCH_MAX_REQUESTS, src/sources/yandex_search.py).
# С 02.10 (D-093) Yandex — запасной путь, выключен по умолчанию: групповой прогон ниже идёт за теми же ключом и
# потолками (YANDEX_MAX_PER_LOT — на группу, YANDEX_MAX_PER_RUN — на прогон), агенты его не запускают. Путь
# «лот → кандидаты» (web_discover.lot_candidates) берёт отсюда только region и skip_domains.

region: "2"            # Санкт-Петербург (идентификатор региона Яндекса)
pages: 1               # страниц выдачи на запрос (по 10 доменов)
max_requests_per_group: 16

templates:
  - "{p} оптом Санкт-Петербург"
  - "{p} поставщик Санкт-Петербург"
  - "{p} производитель"
  - "{p} дистрибьютор"

groups:
  "21.20":   # Препараты лекарственные и материалы, применяемые в медицинских целях
    - "лекарственные препараты"
    - "натрия хлорид раствор для инфузий"
    - "аптечки первой помощи"
    - "вакцины"
  "20.14":   # Вещества химические органические основные прочие (в ЭМ — лимонная кислота, хладоны, растворители)
    - "кислота лимонная пищевая"
    - "фреон хладон R134a"
    - "ацетон технический"
    - "спирт изопропиловый"
  "10.51":   # Молоко и молочная продукция
    - "молочная продукция"
    - "масло сливочное"
    - "сыр полутвердый"
    - "творог"

# Домены, которые не являются сайтом поставщика: агрегаторы, маркетплейсы, справочники, СМИ, госпорталы.
# Совпадение — по самому домену и его поддоменам. ИНН с них не берём.
