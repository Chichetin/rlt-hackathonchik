# Запасной путь блока «Новые» через Яндекс Search (#194, #186; src/enrich/web_discover.py).
# Включается только вместе с клиентом (ключ, YANDEX_MAX_PER_LOT, YANDEX_MAX_PER_RUN в .env человека, D-149)
# и только на лоте, где у бесплатных источников меньше min_strong сильных кандидатов (product_fit ≥ 0.8).
# Агенты Яндекс не вызывают (решение IR630): тесты — фикстуры и httpx.MockTransport.

min_strong: 5          # сильных кандидатов после фильтров меньше — спрашиваем Яндекс и добираем до 5 (решение человека 02.10, #558; было 3)
results: 10            # результатов (доменов) на запрос: одна страница выдачи — один платный запрос
max_sites: 6           # сайтов на лот, которые обходим за ИНН (≤ 4 страницы на сайт, src/sources/site.py)
live_max_sites: 12     # то же по кнопке «Искать в реальном времени» (#583): человек ждёт, сайтов больше

# Модификаторы роли к очищенному тексту лота: один запрос на модификатор (их не больше YANDEX_MAX_PER_LOT).
modifiers:
  goods: ["производитель", "оптом", "официальный дилер"]
  services: ["исполнитель", "подрядчик", "аккредитованная лаборатория"]

# Домены, которые не являются сайтом поставщика: агрегаторы, маркетплейсы, справочники, СМИ, госпорталы.
# Совпадение — по самому домену и его поддоменам. ИНН с них не берём.
