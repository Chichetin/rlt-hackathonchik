# Эксперименты скоринга (#22, research/EXPERIMENTS.md): id эксперимента → правки поверх configs/search.yaml.
# `make eval EXP=<id>` берёт запись по id; id без записи — конфигурация продукта как есть.
# Это НЕ конфигурация продукта: дефолт меняется только в configs/search.yaml и только с подтверждением
# человека №3 (формула и веса — слайд). Блоки weights / signals / options накладываются по ключам.
# С #174 дефолт продукта — H-15f; записи ниже измерены поверх прежнего дефолта v1, поэтому каждая задаёт
# веса и опции явно (якоря &v1_weights, &v1_options) — `make eval EXP=<id>` воспроизводит свой результат
# (проверка: tests/unit/test_eval_run.py::test_experiment_entries_reproduce_recorded_configs).
# #218 (D-083): «География» с тех пор считается от региона заказчика — записи с geography > 0 сняты до #218 и
# воспроизводятся на commit из файла результата; на HEAD различие ≤ 9 из 2000 dev-кейсов (ИНН заказчика 47…).
v1:              # прежний дефолт продукта (D-004, D-029) — воспроизводит E-002 / bm25-dev-v1
  weights: &v1_weights {product_fit: 0.35, experience: 0.2, reliability: 0.2, activity: 0.1, geography: 0.1, price: 0.05}
  options: &v1_options {fit_bm25_share: 0.6, experience_by: class, tie_break: inn}
H-15a-03:        # инкумбент-сигнал в experience, доля 0.3
  weights: *v1_weights
  options: *v1_options
  signals: {incumbent: 0.3}
H-15a-06:
  weights: *v1_weights
  options: *v1_options
  signals: {incumbent: 0.6}
H-15b:           # веса H-15b (сумма доступных компонент 1.0)
  weights: {product_fit: 0.5, experience: 0.25, reliability: 0.0, activity: 0.15, geography: 0.1, price: 0.0}
  options: *v1_options
H-15c:           # регион ИП без КПП или с КПП из нулей — по ИНН (signals.inn_region, #95)
  weights: *v1_weights
  options: *v1_options
  signals: {inn_region: 1.0}
H-15d-tie:       # равные баллы — по BM25, а не по ИНН
  weights: *v1_weights
  options: {fit_bm25_share: 0.6, experience_by: class, tie_break: bm25}
H-15e:           # experience по лотам с похожими позициями вместо группы ОКПД2
  weights: *v1_weights
  options: {fit_bm25_share: 0.6, experience_by: similar, tie_break: inn}
H-15f:           # v2-кандидат: текст важнее, опыт — по похожим позициям, география не штрафует
  weights: {product_fit: 0.8, experience: 0.2, reliability: 0.0, activity: 0.05, geography: 0.0, price: 0.0}
  options: {fit_bm25_share: 0.8, experience_by: similar, tie_break: bm25}
H-15g:           # H-15f + инкумбент-сигнал 0.3
  weights: {product_fit: 0.8, experience: 0.2, reliability: 0.0, activity: 0.05, geography: 0.0, price: 0.0}
  signals: {incumbent: 0.3}
  options: {fit_bm25_share: 0.8, experience_by: similar, tie_break: bm25}
H-15f-geo:       # проверка: H-15f с ненулевым весом географии и регионом ИП по ИНН
  weights: {product_fit: 0.8, experience: 0.2, reliability: 0.0, activity: 0.05, geography: 0.05, price: 0.0}
  signals: {inn_region: 1.0}
  options: {fit_bm25_share: 0.8, experience_by: similar, tie_break: bm25}
R-198-lr:        # обученный ранжировщик (#198): логистическая регрессия поверх кандидатов и компонент v2 (E-003)
  ranker: {kind: logreg, model: models/ranker/R-198-lr.json}
R-198-gbm:       # обученный ранжировщик (#198): LightGBM LambdaMART, объяснение — pred_contrib
  ranker: {kind: lgbm, model: models/ranker/R-198-gbm.txt}
# #268 (E1): признак sem — косинус USER-base запроса и лучшей позиции кандидата (src/match/semantic.py).
# Одна матрица признаков (ranker_train --n 3000, as_of 2025-04-01, этот коммит): E1-* — все признаки,
# E1-base-* — те же строки и seed без столбца sem (парная база). E1-* требуют SEM_VECTORS=<vecs-user-base.parquet>.
E1-lr:
  ranker: {kind: logreg, model: models/ranker/E1-lr.json}
E1-gbm:
  ranker: {kind: lgbm, model: models/ranker/E1-gbm.txt}
E1-base-lr:
  ranker: {kind: logreg, model: models/ranker/E1-base-lr.json}
E1-base-gbm:
  ranker: {kind: lgbm, model: models/ranker/E1-base-gbm.txt}
H-15f-geo-c:     # #218: как H-15f-geo на коде после #218 (география от заказчика); не прогоняется — см. EXPERIMENTS
  weights: {product_fit: 0.8, experience: 0.2, reliability: 0.0, activity: 0.05, geography: 0.05, price: 0.0}
  signals: {inn_region: 1.0}
  options: {fit_bm25_share: 0.8, experience_by: similar, tie_break: bm25}
# #196: потолки насыщения experience поверх дефолта H-15f (в дефолте 20 лотов / 10 побед).
H-196-sat100:
  options: {sat_lots: 100, sat_wins: 50}
H-196-sat500:
  options: {sat_lots: 500, sat_wins: 250}
# Ступень 2 сравнения моделей (#98, ступень 1 — #115): гибрид BM25 + векторы (RRF), остальное — продукт.
S2-hyb-e5s:      # pg_hybrid, intfloat/multilingual-e5-small (vec.names_e5_small)
  retriever: pg_hybrid
S2-hyb-user:     # pg_hybrid, deepvk/USER-base (vec.names_user_base) — лучший гибрид ступени 1 на коротких запросах
  retriever: pg_hybrid
  embedding_model: deepvk/USER-base
